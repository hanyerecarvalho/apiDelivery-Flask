<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <a href="dashboard.html">Voltar ao painel</a>
    <h1 class="my-3">Clientes</h1>
    <form id="formCrud" class="mb-4">
        <p id="modo">Novo cadastro</p>
        <label class="form-label d-block">Nome
            <input class="form-control" name="nomeCliente" type="text" maxlength="45" required>
        </label>
        <label class="form-label d-block">Telefone
            <input class="form-control" name="telefoneCliente" type="text" maxlength="18" required>
        </label>
        <button id="salvar" class="btn btn-primary">Cadastrar</button>
        <button type="button" id="cancelar" class="btn btn-secondary" hidden>Cancelar edição</button>
    </form>
    <p id="mensagem" role="status"></p>
    <label class="form-label" for="filtro">Filtrar registros</label>
    <input class="form-control mb-3" id="filtro" type="search" placeholder="Digite um ID ou parte dos dados">
    <div class="table-responsive">
        <table class="table table-striped">
            <thead><tr><th>ID</th><th>Nome</th><th>Telefone</th><th>Ações</th></tr></thead>
            <tbody id="registros"></tbody>
        </table>
    </div>
    <script type="module">
        import iniciarCrud from "./js/crud.js";
        iniciarCrud("clientes", "cliente", "idCliente", ["nomeCliente","telefoneCliente"]);
    </script>
</body>
</html>
