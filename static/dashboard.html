<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="container p-5 my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Dashboard</h1>
    </div>

    <h3>Cadastro, Atualizar e Deletar</h3>

    <div class="list-group">
        <a class="list-group-item list-group-item-action" href="clientes.html">
            Clientes
        </a>

        <a class="list-group-item list-group-item-action" href="restaurantes.html">
            Restaurantes
        </a>

        <a class="list-group-item list-group-item-action" href="pedidos.html">
            Pedidos
        </a>
    </div>

    <h3 class="mt-4">Buscar</h3>

    <div class="list-group">
        <a class="list-group-item list-group-item-action" href="buscar.html">
            Buscar
        </a>
    </div>

    <button id="sair" type="button" class="btn btn-outline-secondary mt-4">Sair</button>
<script type="module">
    import { verificarLogin } from "./js/auth.js";
    verificarLogin();
    document.getElementById("sair").onclick = () => {
        localStorage.removeItem("jwt");
        window.location.href = "login.html";
    };
</script>

</body>
</html>
