<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>

    .botao {
            border-radius: 15px;
            background-color: rgb(55, 255, 45);
            border-color: rgb(5, 213, 1);
            font-size: 15px;
        }   
        
    #botaoVoltar {
            border-radius: 15px;
            background-color: rgb(24, 24, 24);
            border-color: black;
        }
    #voltar {
        color: aliceblue;
        text-decoration: none;
    }
    </style>
    
</head>
<body class="container p-5 my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Buscar</h1>
    </div>

    <h3>Buscar Clientes</h3>
    <button class="botao" id="botaoBuscarClientes">Buscar</button>
    <h3>Buscar Itens Pedidos</h3>
    <button class="botao" id="botaoBuscarItens">Buscar</button>
    <h3>Buscar Pedidos</h3>
    <button class="botao" id="botaoBuscarPedidos">Buscar</button>
    <h3>Buscar Produtos</h3>
    <button class="botao" id="botaoBuscarProdutos">Buscar</button>
    <h3>Buscar Restaurantes</h3>
    <button class="botao" id="botaoBuscarRestaurantes">Buscar</button>
<br>
    <button class="mt-2" id="botaoVoltar">
        <a href="dashboard.html" class="container" id="voltar">Voltar</a>
    </button>

    <h3 class="mt-3">Resultados da Busca</h3>
    <div id="resultado" class="m-3"></div>



    <script type="module">
        import ApiService from './ApiService.js';
        const api = new ApiService("token");

        const botaoClientes = document.getElementById("botaoBuscarClientes");

        const botaoItens = document.getElementById("botaoBuscarItens");

        const botaoPedidos = document.getElementById("botaoBuscarPedidos");

        const botaoProdutos = document.getElementById("botaoBuscarProdutos");

        const botaoRestaurantes = document.getElementById("botaoBuscarRestaurantes");

        const resultado = document.getElementById("resultado")

        botaoClientes.onclick = async function () {
            
            const respostaAPI = await api.get(
                "/clientes"
            )

            console.log(respostaAPI);

            if (respostaAPI.success = true) {
                resultado.innerHTML = "";

                const clientes = respostaAPI.data.clientes;

                clientes.forEach(cliente => {
                    resultado.innerHTML += `
                    <p>
                        <strong>ID:</strong> ${cliente.idCliente}
                        <br>
                        <strong>Nome:</strong> ${cliente.nomeCliente}
                        <br>
                        <strong>Telefone:</strong> ${cliente.telefoneCliente}
                    </p>
                    `;
                });
            } else {
                resultadoClientes.innerHTML = "Erro ao buscar clientes.";
            }
        }

        botaoItens.onclick = async function () {

            const respostaAPI = await api.get("/itensPedidos");

            console.log(respostaAPI);

            if (respostaAPI.success === true) {

                resultado.innerHTML = "";

                const itens = respostaAPI.data.itensPedido;

                itens.forEach(item => {

                    resultado.innerHTML += `
                        <p>
                            <strong>ID:</strong> ${item.idItemPedido}
                            <br>
                            <strong>Quantidade:</strong> ${item.quantidade}
                            <br>
                            <strong>ID Pedido:</strong> ${item.idPedido}
                            <br>
                            <strong>ID Produto:</strong> ${item.idProduto}
                        </p>
                        <hr>
                    `;

                });

            } else {

                resultado.innerHTML = "Erro ao buscar itens pedidos.";

            }

            console.log(respostaAPI)
        }
        botaoPedidos.onclick = async function () {

            const respostaAPI = await api.get("/pedidos");

            console.log(respostaAPI);

            if (respostaAPI.success === true) {

                resultado.innerHTML = "";

                const pedidos = respostaAPI.data.Pedido;

                pedidos.forEach(pedido => {

                    resultado.innerHTML += `
                        <p>
                            <strong>ID:</strong> ${pedido.idPedido}
                            <br>
                            <strong>Data:</strong> ${pedido.dataPedido}
                            <br>
                            <strong>ID Cliente:</strong> ${pedido.idCliente}
                        </p>
                        <hr>
                    `;

                });

            } else {

                resultado.innerHTML = "Erro ao buscar pedidos.";

            }
        }


        botaoProdutos.onclick = async function () {

            const respostaAPI = await api.get("/produtos");

            console.log(respostaAPI);

            if (respostaAPI.success === true) {

                resultado.innerHTML = "";

                const produtos = respostaAPI.data.Produtos;

                produtos.forEach(produto => {

                    resultado.innerHTML += `
                        <p>
                            <strong>ID:</strong> ${produto.idProduto}
                            <br>
                            <strong>Nome:</strong> ${produto.nomeProduto}
                            <br>
                            <strong>Preço:</strong> ${produto.precoProduto}
                            <br>
                            <strong>ID Restaurante:</strong> ${produto.idRestaurante}
                        </p>
                        <hr>
                    `;

                });

            } else {

                resultado.innerHTML = "Erro ao buscar produtos.";

            }
        }


        botaoRestaurantes.onclick = async function () {

            const respostaAPI = await api.get("/restaurante");

            console.log(respostaAPI);

            if (respostaAPI.success === true) {

                resultado.innerHTML = "";

                const restaurantes = respostaAPI.data.Restaurante;

                restaurantes.forEach(restaurante => {

                    resultado.innerHTML += `
                        <p>
                            <strong>ID:</strong> ${restaurante.idRestaurante}
                            <br>
                            <strong>Nome:</strong> ${restaurante.nomeRestaurante}
                            <br>
                            <strong>Endereço:</strong> ${restaurante.enderecoRestaurante}
                        </p>
                        <hr>
                    `;

                });

            } else {

                resultado.innerHTML = "Erro ao buscar restaurantes.";

            }
        }
    </script>
</body>
</html>
